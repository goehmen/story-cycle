<!--
  Inline CSS injected into the <head> of pandoc HTML output via
  `--include-in-header=docs/_pandoc/header.html`.

  Purpose: override Google Docs' default rendering of <th> and <table>
  elements on HTML import. Pandoc's defaults plus Google Docs' table
  interpretation produce headers with excessive vertical padding ("the
  carriage return or two" effect) and missing borders. Inline CSS in <style>
  is honored during GD's HTML import where <link rel="stylesheet"> is not.

  All rules use !important to override pandoc's own default style block,
  which is emitted before this header in `--standalone` mode.
-->
<style>
  /* --- Tables --- */
  table {
    border-collapse: collapse !important;
    margin: 1em 0 !important;
  }
  th, td {
    padding: 6px 10px !important;
    vertical-align: top !important;
    line-height: 1.3 !important;
    border: 1px solid #000 !important;
    /* Prevent long URLs/paths from forcing a column wider than the page. */
    word-wrap: break-word !important;
    overflow-wrap: break-word !important;
  }
  /* Defensive: if pandoc ever wraps cell content in <p>, zero its margin
     so the cell doesn't acquire extra vertical space. */
  th p, td p {
    margin: 0 !important;
    padding: 0 !important;
  }
  thead {
    display: table-row-group !important;
  }
  th {
    background-color: #f5f5f5 !important;
    font-weight: bold !important;
    text-align: left !important;
  }

  /* --- Paragraph spacing inside lists ---
     Google Docs' HTML import sometimes collapses consecutive <p> elements
     inside <li> into adjacent paragraphs with no visible gap, producing the
     "smushed paragraphs" effect. Force explicit gap. */
  li p {
    margin-top: 0.5em !important;
    margin-bottom: 0.5em !important;
  }
  li p:first-child {
    margin-top: 0 !important;
  }
  li p:last-child {
    margin-bottom: 0 !important;
  }
</style>
